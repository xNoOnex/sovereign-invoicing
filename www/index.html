<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Contract & Invoice Dispatcher</title>
  <style>
    :root {
      --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9;
      --accent: #238636; --blue: #58a6ff; --purple: #bc8cff; --amber: #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, monospace; background: var(--bg); color: var(--text); padding-bottom: 100px; }
    .header { padding: 20px 16px 10px 16px; border-bottom: 1px solid var(--border); background: var(--card); }
    h1 { font-size: 1.1rem; color: var(--text); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
    h1 span { color: var(--blue); margin-left: 8px; }
    
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
    .full-width { grid-column: span 2; }
    
    label { display: block; font-size: 0.65rem; color: #8b949e; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: bold; }
    input, select, textarea { 
      width: 100%; background: #010409; border: 1px solid var(--border); color: #e6edf3; 
      padding: 12px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; transition: all 0.2s;
    }
    textarea { height: 140px; resize: none; line-height: 1.4; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 1px var(--purple); background: #0d1117; }
    
    #toast { 
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 20px;
      font-size: 0.8rem; font-weight: bold; font-family: monospace; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000;
    }
    
    /* Sticky Action Bar */
    .action-bar {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border);
      padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 100; max-width: 600px; margin: 0 auto;
    }
    .action-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
      color: var(--text); font-size: 0.7rem; font-family: monospace; text-transform: uppercase; cursor: pointer; transition: background 0.1s;
    }
    .action-btn:active { background: var(--border); }
    .action-btn svg { margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Contract <span>Dispatcher</span></h1>
  </div>

  <div class="container">
    <div class="grid">
      <div><label>Invoice ID</label><input type="text" id="invNum" style="color: var(--blue); font-weight: bold;"></div>
      <div><label>Date</label><input type="text" id="docDate"></div>
    </div>

    <div class="grid">
      <div class="full-width"><label>Client Business Name</label><input type="text" id="clientName" placeholder="e.g. Desert Logistics LLC"></div>
      <div><label>Contact Name</label><input type="text" id="contactName" placeholder="e.g. Yvette Soto"></div>
      <div><label>Phone / Email</label><input type="text" id="contactInfo" placeholder="520-555-0199"></div>
    </div>

    <div class="grid">
      <div><label>Total Fee ($)</label><input type="number" id="totalFee" placeholder="1500" oninput="calculateDeposit()"></div>
      <div><label>50% Deposit ($)</label><input type="number" id="deposit" placeholder="750" style="color: #7ee787;"></div>
      <div><label>Payment Routing</label><input type="text" id="cashTag" value="$QuintanMiddle"></div>
      <div>
        <label>Status</label>
        <select id="status">
          <option>Deposit Due</option>
          <option>Paid in Full</option>
          <option>Pending Delivery</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <div class="full-width">
        <label>Binding Scope Statement</label>
        <textarea id="scope">1. Standalone Native Android Application (.apk)
2. Offline-First Database Architecture
3. Sign-on-Glass Bill of Lading (BOL) Module
4. Automated PDF / CSV Export Engine
5. Configuration of local branding, crew rates, and service matrices.
6. Zero recurring software licenses, hosting fees, or monthly overhead.</textarea>
      </div>
    </div>
  </div>

  <div id="toast">State Saved Locally</div>

  <div class="action-bar">
    <button class="action-btn" onclick="saveDraft()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      Save Draft
    </button>
    <button class="action-btn" onclick="shareInvoice()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
      Export Document
    </button>
    <button class="action-btn" onclick="sendSMS()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Dispatch SMS
    </button>
    <button class="action-btn" onclick="sendEmail()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bc8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
      Dispatch Email
    </button>
  </div>

  <script>
    function generateAutoID() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const rand = Math.floor(Math.random() * 90 + 10);
      return `QM-${yyyy}${mm}${dd}-${rand}`;
    }

    window.onload = () => {
      const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('docDate').value = today;
      
      const saved = localStorage.getItem('invoice_draft');
      if (saved) {
        const data = JSON.parse(saved);
        ['invNum', 'docDate', 'clientName', 'contactName', 'contactInfo', 'cashTag', 'status', 'totalFee', 'deposit', 'scope'].forEach(id => {
          if (data[id]) document.getElementById(id).value = data[id];
        });
      }
      
      if (!document.getElementById('invNum').value) {
        document.getElementById('invNum').value = generateAutoID();
      }
    };

    function calculateDeposit() {
      const fee = parseFloat(document.getElementById('totalFee').value) || 0;
      document.getElementById('deposit').value = (fee * 0.5).toFixed(2);
    }

    function saveDraft() {
      const data = {};
      ['invNum', 'docDate', 'clientName', 'contactName', 'contactInfo', 'cashTag', 'status', 'totalFee', 'deposit', 'scope'].forEach(id => {
        data[id] = document.getElementById(id).value;
      });
      localStorage.setItem('invoice_draft', JSON.stringify(data));
      
      const toast = document.getElementById('toast');
      toast.style.opacity = '1';
      setTimeout(() => toast.style.opacity = '0', 2500);
    }

    function buildPayload() {
      const inv = document.getElementById('invNum').value;
      const date = document.getElementById('docDate').value;
      const client = document.getElementById('clientName').value || 'Client';
      const contact = document.getElementById('contactName').value || 'N/A';
      const fee = document.getElementById('totalFee').value;
      const dep = document.getElementById('deposit').value;
      const tag = document.getElementById('cashTag').value;
      const scope = document.getElementById('scope').value;

      return `SOFTWARE DEPLOYMENT AGREEMENT\n===============================\nInvoice: ${inv}\nDate: ${date}\nClient: ${client}\nContact: ${contact}\n\nFINANCIALS:\nTotal Deployment Fee: $${fee}\nDeposit Required (50%): $${dep}\nPayment Routing: ${tag}\n\nBINDING SCOPE OF WORK:\n${scope}\n\n===============================\nEngineered by Quintan Middle\nTucson, Arizona\n(520) 634-9490\n\n*By rendering the deposit, the client authorizes commencement of the scope defined above.*`;
    }

    async function shareInvoice() {
      const payload = buildPayload();
      const inv = document.getElementById('invNum').value;
      
      if (navigator.share) {
        try {
          await navigator.share({
            title: `Agreement_${inv}`,
            text: payload,
          });
        } catch (err) { console.log('Share canceled or failed', err); }
      } else {
        navigator.clipboard.writeText(payload);
        alert("Document payload copied to clipboard.");
      }
    }

    function sendSMS() {
      const phone = document.getElementById('contactInfo').value;
      const body = encodeURIComponent(buildPayload());
      window.location.href = `sms:${phone}?body=${body}`;
    }

    function sendEmail() {
      const email = document.getElementById('contactInfo').value;
      const inv = document.getElementById('invNum').value;
      const subject = encodeURIComponent(`Deployment Agreement & Invoice: ${inv}`);
      const body = encodeURIComponent(buildPayload());
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
